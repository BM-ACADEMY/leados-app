<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllianceOS — ABM Groups</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --navy: #0D1B2A;
    --navy2: #162233;
    --navy3: #1E2F45;
    --gold: #E4A500;
    --gold2: #FFB800;
    --teal: #007B83;
    --teal2: #009AA3;
    --light: #F5F7FA;
    --white: #FFFFFF;
    --dark: #1A1A2E;
    --grey: #6C757D;
    --lgrey: #DEE2E6;
    --green: #2E7D32;
    --lgreen: #E8F5E9;
    --red: #C62828;
    --lred: #FFEBEE;
    --orange: #E65100;
    --lorange: #FFF3E0;
    --purple: #6A1B9A;
    --lpurple: #F3E5F5;
    --hot: #FF6B35;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--navy2);
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-logo .brand {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .sidebar-logo .sub {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .sidebar-section {
    padding: 12px 10px 4px;
    font-size: 9px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    cursor: pointer;
    border-radius: 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.55);
    transition: all 0.15s;
    border-left: 3px solid transparent;
    font-weight: 400;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
  .nav-item.active {
    background: rgba(228,165,0,0.1);
    color: var(--gold);
    border-left-color: var(--gold);
    font-weight: 600;
  }
  .nav-item .icon { font-size: 14px; width: 16px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    background: var(--hot);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 14px 18px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .founder-card {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .founder-avatar {
    width: 32px; height: 32px;
    background: var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: var(--navy);
  }
  .founder-name { font-size: 12px; font-weight: 600; }
  .founder-role { font-size: 10px; color: rgba(255,255,255,0.4); }

  /* MAIN CONTENT */
  .main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    background: var(--navy);
  }

  /* TOPBAR */
  .topbar {
    height: 56px;
    background: var(--navy2);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    flex: 1;
  }
  .topbar-search {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 7px 14px;
    color: white;
    font-size: 12px;
    width: 220px;
    outline: none;
  }
  .topbar-search::placeholder { color: rgba(255,255,255,0.3); }
  .topbar-btn {
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  /* SCREENS */
  .screen { display: none; padding: 24px; }
  .screen.active { display: block; }

  /* CARDS */
  .card {
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 20px;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  /* STAT CARDS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 18px 16px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--gold);
  }
  .stat-card.teal::before { background: var(--teal); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.hot::before { background: var(--hot); }
  .stat-card.purple::before { background: var(--purple); }
  .stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-card.teal .stat-val { color: var(--teal2); }
  .stat-card.green .stat-val { color: #4CAF50; }
  .stat-card.hot .stat-val { color: var(--hot); }
  .stat-card.purple .stat-val { color: #CE93D8; }
  .stat-lbl {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    font-weight: 500;
  }
  .stat-change {
    font-size: 10px;
    margin-top: 6px;
    font-weight: 600;
  }
  .stat-change.up { color: #4CAF50; }
  .stat-change.down { color: var(--red); }

  /* TABLES */
  .table-wrap { overflow-x: auto; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    background: var(--navy3);
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  td {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
    color: rgba(255,255,255,0.75);
  }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr:last-child td { border-bottom: none; }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .badge-hot { background: rgba(255,107,53,0.2); color: var(--hot); }
  .badge-warm { background: rgba(228,165,0,0.2); color: var(--gold); }
  .badge-cool { background: rgba(0,123,131,0.2); color: var(--teal2); }
  .badge-done { background: rgba(46,125,50,0.2); color: #4CAF50; }
  .badge-new  { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.5); }
  .badge-skip { background: rgba(108,117,125,0.2); color: var(--grey); }

  /* SCORE BAR */
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 12px;
  }
  .score-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* GRID LAYOUTS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
  .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }

  /* PIPELINE KANBAN */
  .kanban {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    min-height: 400px;
  }
  .kanban-col { background: var(--navy3); border-radius: 10px; padding: 12px; }
  .kanban-header {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .kanban-count {
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
  }
  .kanban-card {
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .kanban-card:hover {
    border-color: rgba(228,165,0,0.3);
    transform: translateY(-1px);
  }
  .kanban-card-name { font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
  .kanban-card-meta { font-size: 10px; color: rgba(255,255,255,0.4); }
  .kanban-card-score {
    font-size: 11px;
    font-weight: 700;
    margin-top: 6px;
  }

  /* LEAD PROFILE */
  .profile-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 20px;
    background: var(--navy2);
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .profile-score-circle {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) 0% 88%, rgba(255,255,255,0.1) 88% 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .profile-score-inner {
    width: 54px; height: 54px;
    background: var(--navy2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .profile-score-val {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }
  .profile-score-lbl { font-size: 8px; color: rgba(255,255,255,0.4); }
  .profile-info { flex: 1; }
  .profile-name {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .profile-meta { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
  .profile-tags { display: flex; gap: 8px; flex-wrap: wrap; }

  /* TIMELINE */
  .timeline { padding-left: 20px; position: relative; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 6px; top: 0; bottom: 0;
    width: 2px;
    background: rgba(255,255,255,0.07);
  }
  .timeline-item { position: relative; margin-bottom: 16px; }
  .timeline-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--navy2);
    border: 2px solid var(--gold);
    position: absolute;
    left: -23px;
    top: 3px;
  }
  .timeline-dot.teal { border-color: var(--teal); }
  .timeline-dot.grey { border-color: var(--grey); }
  .timeline-content {
    background: var(--navy3);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .timeline-label { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
  .timeline-text { font-size: 11px; color: rgba(255,255,255,0.5); }
  .timeline-time { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 4px; }

  /* KB SCREEN */
  .kb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kb-card {
    background: var(--navy3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 16px;
    transition: all 0.15s;
  }
  .kb-card:hover { border-color: rgba(228,165,0,0.3); }
  .kb-card-brand {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .kb-card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .kb-card-meta { font-size: 10px; color: rgba(255,255,255,0.4); }
  .kb-card-chars {
    margin-top: 10px;
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kb-bar { background: rgba(255,255,255,0.06); border-radius: 3px; flex: 1; height: 4px; }
  .kb-bar-fill { height: 4px; border-radius: 3px; background: var(--teal); }

  /* UPLOAD SCREEN */
  .upload-zone {
    border: 2px dashed rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    transition: all 0.2s;
    cursor: pointer;
    background: rgba(255,255,255,0.02);
  }
  .upload-zone:hover {
    border-color: var(--gold);
    background: rgba(228,165,0,0.04);
  }
  .upload-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .upload-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .upload-sub { font-size: 12px; color: rgba(255,255,255,0.35); }

  /* FORM ELEMENTS */
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .form-control {
    width: 100%;
    background: var(--navy3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 9px 12px;
    color: white;
    font-size: 12.5px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-control:focus { border-color: var(--gold); }
  .form-select {
    width: 100%;
    background: var(--navy3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 9px 12px;
    color: white;
    font-size: 12.5px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    cursor: pointer;
  }

  /* PROMPT SCREEN */
  .prompt-card {
    background: var(--navy3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .prompt-name {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .prompt-purpose { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
  .prompt-body {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.6);
    background: var(--navy2);
    border-radius: 6px;
    padding: 10px;
    line-height: 1.6;
    max-height: 80px;
    overflow: hidden;
    position: relative;
  }
  .prompt-body::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: linear-gradient(transparent, var(--navy3));
  }

  /* ALERT STRIP */
  .alert-strip {
    background: rgba(255,107,53,0.12);
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .alert-strip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--hot);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }

  /* ACTION BUTTONS */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--gold); color: var(--navy); }
  .btn-primary:hover { background: var(--gold2); }
  .btn-secondary {
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }
  .btn-teal { background: var(--teal); color: white; }
  .btn-danger { background: rgba(198,40,40,0.15); color: #EF9A9A; border: 1px solid rgba(198,40,40,0.3); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }

  /* SECTION HEADERS */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
  }
  .section-subtitle { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  /* DIVIDER */
  .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 20px 0; }

  /* MINI CHART BARS */
  .mini-chart { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
  .mini-bar { flex: 1; background: var(--teal); border-radius: 3px 3px 0 0; opacity: 0.7; transition: opacity 0.2s; }
  .mini-bar:hover { opacity: 1; }

  /* PROGRESS */
  .progress-track { background: rgba(255,255,255,0.07); border-radius: 4px; height: 6px; overflow: hidden; }
  .progress-fill { height: 6px; border-radius: 4px; background: var(--gold); transition: width 0.5s; }
  .progress-fill.teal { background: var(--teal); }
  .progress-fill.green { background: #4CAF50; }

  /* HOT LEAD CARD */
  .hot-lead {
    background: linear-gradient(135deg, rgba(255,107,53,0.12), rgba(228,165,0,0.06));
    border: 1px solid rgba(255,107,53,0.25);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hot-score {
    width: 44px; height: 44px;
    background: rgba(255,107,53,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--hot);
    flex-shrink: 0;
  }
  .hot-info { flex: 1; }
  .hot-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .hot-hook { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.4; }
  .hot-action { display: flex; gap: 6px; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: rgba(255,255,255,0.45);
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .tab.active {
    background: rgba(228,165,0,0.12);
    color: var(--gold);
    border-color: rgba(228,165,0,0.25);
  }
  .tab:hover:not(.active) { color: rgba(255,255,255,0.7); }

  /* n8n STATUS PILL */
  .n8n-pill {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .n8n-send { background: rgba(0,123,131,0.2); color: var(--teal2); }
  .n8n-m1 { background: rgba(230,81,0,0.2); color: #FFAB40; }
  .n8n-replied { background: rgba(46,125,50,0.2); color: #4CAF50; }
  .n8n-done { background: rgba(108,117,125,0.2); color: var(--grey); }
</style>
